name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04  # 3.9 沒有 Ubuntu 26.04 的預編版本
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs
